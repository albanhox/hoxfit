<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>HoxFit</title>
<meta name="description" content="Personal calorie, macro and weight tracker with real product photos and barcode scanning.">
<meta name="theme-color" content="#0E7C72" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HoxFit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://world.openfoodfacts.org">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F1F5F3; --bg2:#E6EEEA; --surface:#FFFFFF; --surface2:#EDF2EF; --surface3:#E2EAE6; --ink:#12201B; --muted:#5C6B66; --faint:#93A19C;
  --line:#DCE4E0; --line2:#CFD9D4; --accent:#0F7F74; --accent2:#26B3A3; --accent-ink:#FFFFFF; --accent-soft:#D8EFEB; --glow:rgba(15,127,116,.18);
  --warn:#B4531A; --warn2:#E27A3A; --warn-soft:#F7E4D8; --good:#2E7D4F; --water:#3B82C4; --water-soft:#DCEAF7;
  --protein:#2F6BE0; --carbs:#D98B1A; --fat:#C24E8A;
  --shadow:0 12px 32px rgba(18,32,27,.10); --shadow-sm:0 2px 8px rgba(18,32,27,.06);
  --display:"Bricolage Grotesque","Avenir Next",Avenir,"Segoe UI",sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1210; --bg2:#0F1A17; --surface:#141D1A; --surface2:#1B2622; --surface3:#22302B; --ink:#E7EDEA; --muted:#9AA9A4; --faint:#66756F;
    --line:#233029; --line2:#2C3B35; --accent:#35CDB9; --accent2:#7BE3D3; --accent-ink:#062421; --accent-soft:#163C37; --glow:rgba(53,205,185,.22);
    --warn:#F0A06A; --warn2:#F7BF95; --warn-soft:#3A2418; --good:#6FCB8F; --water:#6FB1F0; --water-soft:#183043;
    --protein:#4F82E3; --carbs:#BF7A1C; --fat:#CF5A96;
    --shadow:0 14px 40px rgba(0,0,0,.5); --shadow-sm:0 2px 10px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1210; --bg2:#0F1A17; --surface:#141D1A; --surface2:#1B2622; --surface3:#22302B; --ink:#E7EDEA; --muted:#9AA9A4; --faint:#66756F;
  --line:#233029; --line2:#2C3B35; --accent:#35CDB9; --accent2:#7BE3D3; --accent-ink:#062421; --accent-soft:#163C37; --glow:rgba(53,205,185,.22);
  --warn:#F0A06A; --warn2:#F7BF95; --warn-soft:#3A2418; --good:#6FCB8F; --water:#6FB1F0; --water-soft:#183043;
  --protein:#4F82E3; --carbs:#BF7A1C; --fat:#CF5A96;
  --shadow:0 14px 40px rgba(0,0,0,.5); --shadow-sm:0 2px 10px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);background-image:radial-gradient(120% 55% at 50% -12%,var(--glow) 0%,transparent 62%);background-repeat:no-repeat;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
img{max-width:100%}
a{color:var(--accent)}
.row,.result,.btn,.iconbtn,.chip,.wk,.drop,nav.tabs button{transition:transform .16s var(--ease),background .16s,opacity .16s}
.row:active,.result:active,.btn:active,.iconbtn:active,.chip:active,.wk:active,.drop:active{transform:scale(.97)}
#app{max-width:620px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:calc(112px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in oklab,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);padding:calc(12px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.03em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.02em}
.brand .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));display:inline-block;align-self:center;box-shadow:0 0 0 4px var(--glow)}
.streak{font-size:12px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:6px 10px;border-radius:999px;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm)}
.streak:empty{display:none}
main{padding:0 14px;display:flex;flex-direction:column;gap:16px}
section.view{display:flex;flex-direction:column;gap:16px;animation:fadeup .32s var(--ease)}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px}
.datenav h2{font-size:18px;font-weight:700}
.datenav .sub{font-size:12px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink);flex:none;box-shadow:var(--shadow-sm)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface2);color:var(--ink)}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 2px}
.wk{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 6px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.wk.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.wk .b{width:100%;height:34px;display:flex;align-items:flex-end;justify-content:center}
.wk .b i{display:block;width:10px;border-radius:5px;background:var(--surface3);min-height:4px}
.wk.ok .b i{background:linear-gradient(180deg,var(--accent2),var(--accent))}
.wk.over .b i{background:linear-gradient(180deg,var(--warn2),var(--warn))}
.wk span{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.wk.today span{color:var(--ink)}
.wk small{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(155deg,color-mix(in oklab,var(--accent) 16%,var(--surface)) 0%,var(--surface) 55%);border:1px solid var(--line);border-radius:24px;padding:18px 18px 16px;display:grid;grid-template-columns:156px 1fr;gap:16px;align-items:center;box-shadow:var(--shadow-sm)}
.hero.over{background:linear-gradient(155deg,color-mix(in oklab,var(--warn) 16%,var(--surface)) 0%,var(--surface) 55%)}
.ring{position:relative;width:156px;height:156px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .track{stroke:color-mix(in oklab,var(--ink) 8%,transparent)}
.ring .arc{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease);filter:drop-shadow(0 0 6px var(--glow))}
.hero.over .ring .arc{stroke:url(#ringGradWarn)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .center b{font-family:var(--display);font-size:36px;font-weight:800;letter-spacing:-.045em;line-height:1}
.ring .center span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:5px;font-weight:600}
.hero .stats{display:flex;flex-direction:column;gap:9px}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px dashed var(--line2);padding-bottom:6px}
.stat:last-child{border-bottom:0;padding-bottom:0}
.stat label{font-size:12px;color:var(--muted)}
.stat b{font-family:var(--display);font-size:18px;font-weight:700}
.stat b small{font-size:11px;color:var(--muted);font-weight:500;font-family:var(--body)}
.stat b.warn{color:var(--warn)}
.stat b.good{color:var(--good)}
.stat b.acc{color:var(--accent)}
@media (max-width:420px){.hero{grid-template-columns:132px 1fr;gap:12px;padding:14px}.ring{width:132px;height:132px}.ring .center b{font-size:30px}}
/* macros */
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.macro{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 12px 11px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow-sm)}
.macro .lab{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.macro .lab i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.macro b{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.02em}
.macro b small{font-size:12px;font-weight:500;color:var(--muted);font-family:var(--body);letter-spacing:0}
.bar{height:6px;border-radius:4px;background:var(--surface3);overflow:hidden}
.bar div{height:100%;border-radius:4px;transition:width .6s var(--ease)}
.macro.protein .bar div,.macro.protein .lab i{background:var(--protein)}
.macro.carbs .bar div,.macro.carbs .lab i{background:var(--carbs)}
.macro.fat .bar div,.macro.fat .lab i{background:var(--fat)}
/* quick actions & chips */
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools .btn{flex:1;padding:12px 12px;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;max-width:210px;box-shadow:var(--shadow-sm)}
.chip .tile{width:28px;height:28px;border-radius:50%;font-size:15px}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip small{color:var(--muted);font-weight:500;font-size:12px;flex:none}
/* meals */
.meal{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-sm)}
.meal header{display:flex;justify-content:space-between;align-items:center;padding:13px 16px 9px}
.meal header h3{font-size:15px;font-weight:700}
.meal header .kcal{font-size:13px;color:var(--muted)}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:9px 16px;border-top:1px solid var(--line);text-align:left;width:100%}
.tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--surface2);overflow:hidden;flex:none;position:relative}
.tile img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.tile.photo{background:#fff;border:1px solid var(--line)}
.row .t{min-width:0}
.row .t b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .k{font-family:var(--display);font-weight:700;font-size:15px;text-align:right}
.row .k small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted)}
.row .k.plus{color:var(--good)}
.addrow{display:flex;align-items:center;gap:8px;padding:11px 16px;border-top:1px solid var(--line);color:var(--accent);font-weight:600;font-size:14px;width:100%;text-align:left}
.empty{padding:6px 16px 12px;font-size:13px;color:var(--faint)}
/* water */
.water{display:flex;align-items:center;gap:10px;justify-content:space-between}
.drops{display:flex;gap:7px;flex-wrap:wrap}
.drop{width:30px;height:30px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center}
.drop svg{width:16px;height:16px;fill:var(--faint)}
.drop.on{background:var(--water-soft);border-color:transparent}
.drop.on svg{fill:var(--water)}
/* cards + forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow-sm)}
.card h3{font-size:15px;font-weight:700;margin-bottom:10px}
.card .hint{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.card.flat{box-shadow:none}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--muted);letter-spacing:.02em}
.field input,.field select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;width:100%;-webkit-appearance:none;appearance:none}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.field input:focus{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.inline{display:flex;gap:8px;align-items:flex-end}
.inline .field{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:13px;font-weight:600;font-size:14px;background:var(--surface2);color:var(--ink);border:1px solid transparent;white-space:nowrap}
.btn.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--accent-ink);box-shadow:0 6px 18px var(--glow)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{color:var(--warn);background:var(--warn-soft)}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;background:var(--surface2);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv span{color:var(--muted)}
.kv b{font-family:var(--display);font-weight:700}
.banner{background:var(--accent-soft);color:var(--accent);border-radius:18px;padding:14px 16px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tiles .card{padding:12px 14px}
.tiles label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.tiles b{display:block;font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.tiles small{display:block;font-size:12px;color:var(--muted)}
.tiles.three{grid-template-columns:repeat(3,1fr)}
.tiles.three b{font-size:20px}
.list{display:flex;flex-direction:column}
.list .row{border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .goal{stroke:var(--warn);stroke-dasharray:4 4;stroke-width:1.5;fill:none}
.chart .ma{stroke:var(--accent);stroke-width:2;fill:none;opacity:.45}
.chart .line{stroke:var(--accent);stroke-width:2;fill:none}
.chart .area{fill:var(--accent);opacity:.08}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2.5}
.chart .lbl{fill:var(--ink);font-size:12px;font-weight:600;font-family:var(--display)}
.chart .cross{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;transform:translate(-50%,-115%);white-space:nowrap;box-shadow:var(--shadow)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:8px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-right:5px}
.legend i.g{border-top:2px dashed var(--warn)}
.legend i.m{opacity:.45}
/* floating tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
nav.tabs .in{pointer-events:auto;display:flex;width:100%;max-width:560px;background:color-mix(in oklab,var(--surface) 86%,transparent);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:var(--shadow)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em;border-radius:18px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent);background:var(--accent-soft)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(6,12,10,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .22s ease;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92dvh;border-radius:26px 26px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:up .36s var(--ease);position:relative}
.sheet::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;border-radius:2px;background:var(--line2);transform:translateX(-50%)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 8px}
.sheet .hd h3{font-size:19px;font-weight:700}
.sheet .bd{padding:6px 18px calc(22px + env(safe-area-inset-bottom));overflow:auto;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.searchbar{display:flex;gap:8px}
.searchbar input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;min-width:0}
.searchbar input:focus{border-color:var(--accent)}
.subh{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;margin:6px 0 -4px}
.result{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:16px;text-align:left;width:100%;background:var(--surface)}
.result .tile{width:56px;height:56px;font-size:28px;border-radius:14px}
.result .t{min-width:0}
.result .t b{display:block;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result .t span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result .t em{display:block;font-style:normal;font-size:12px;color:var(--faint);margin-top:2px}
.result .k{font-family:var(--display);font-weight:700;font-size:16px;text-align:right}
.result .k small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted)}
.skel{height:78px;border-radius:16px;background:linear-gradient(90deg,var(--surface2) 25%,var(--surface3) 50%,var(--surface2) 75%);background-size:200% 100%;animation:shim 1.3s linear infinite}

.detail{display:flex;flex-direction:column;gap:14px}

function drawChart(el, s, goal){
  if (s.length < 2) { el.innerHTML = `<div class="empty" style="padding:26px 0;text-align:center">Log two weigh-ins and your trend appears here.</div>`; return; }
  const W = Math.max(el.clientWidth || 320, 280), H = 230, pl = 46, pr = 18, pt = 18, pb = 30;
  const t0 = parseD(s[0].date).getTime(), t1 = Math.max(parseD(s[s.length-1].date).getTime(), t0 + 6*864e5);
  const x = t => pl + (t - t0) / (t1 - t0) * (W - pl - pr);
  const ws = s.map(p => p.w).concat(goal != null ? [goal] : []);
  let lo = Math.min(...ws), hi = Math.max(...ws); const padY = Math.max((hi - lo) * .15, 1.5); lo -= padY; hi += padY;
  const y = w => pt + (hi - w) / (hi - lo) * (H - pt - pb);
  const pts = s.map(p => ({ ...p, t: parseD(p.date).getTime(), X: x(parseD(p.date).getTime()), Y: y(p.w) }));
  const ma = pts.map(p => { const win = pts.filter(q => q.t <= p.t && q.t > p.t - 7*864e5); return { X: p.X, Y: y(win.reduce((a,b) => a + b.w, 0) / win.length) }; });
  const ticks = 4, tickVals = Array.from({length: ticks+1}, (_, i) => lo + (hi - lo) * i / ticks);
  const path = arr => arr.map((p, i) => (i ? 'L' : 'M') + p.X.toFixed(1) + ' ' + p.Y.toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  const xl = [pts[0], pts[Math.floor(pts.length/2)], last].filter((p, i, a) => a.indexOf(p) === i);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Weight over time">
    ${tickVals.map(v => `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="axis num" x="${pl-8}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${units()==='kg' ? (v*LB).toFixed(1) : v.toFixed(1)}</text>`).join('')}
    ${goal != null ? `<line class="goal" x1="${pl}" x2="${W-pr}" y1="${y(goal).toFixed(1)}" y2="${y(goal).toFixed(1)}"/>` : ''}
    <path class="area" d="${path(pts)} L${last.X.toFixed(1)} ${(H-pb).toFixed(1)} L${pts[0].X.toFixed(1)} ${(H-pb).toFixed(1)} Z"/>
    ${pts.length >= 3 ? `<path class="ma" d="${path(ma)}"/>` : ''}
    <path class="line" d="${path(pts)}"/>
    ${pts.length <= 90 ? pts.slice(0,-1).map(p => `<circle class="dot" cx="${p.X.toFixed(1)}" cy="${p.Y.toFixed(1)}" r="4"/>`).join('') : ''}
    <circle class="end" cx="${last.X.toFixed(1)}" cy="${last.Y.toFixed(1)}" r="5.5"/>
    <text class="lbl num" x="${(last.X - 8).toFixed(1)}" y="${(last.Y - 12).toFixed(1)}" text-anchor="end">${fmtW(last.w)}</text>
    ${xl.map(p => `<text class="axis" x="${p.X.toFixed(1)}" y="${H-8}" text-anchor="${p === pts[0] ? 'start' : p === last ? 'end' : 'middle'}">${fmtDate(p.date,{month:'short',day:'numeric'})}</text>`).join('')}
    <line class="cross" id="cross" x1="0" x2="0" y1="${pt}" y2="${H-pb}" style="display:none"/>
    <rect x="${pl}" y="${pt}" width="${W-pl-pr}" height="${H-pt-pb}" fill="transparent" id="hit"/>
  </svg>`;
  const svg = el.querySelector('svg'), hit = el.querySelector('#hit'), cross = el.querySelector('#cross'); let tip = null;
  const move = ev => {
    const r = svg.getBoundingClientRect(); const cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left; const sx = cx * W / r.width;
    let best = pts[0]; for (const p of pts) if (Math.abs(p.X - sx) < Math.abs(best.X - sx)) best = p;
    cross.style.display = ''; cross.setAttribute('x1', best.X); cross.setAttribute('x2', best.X);
    if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; el.appendChild(tip); }
    tip.textContent = `${fmtDate(best.date,{weekday:'short',month:'short',day:'numeric'})} · ${fmtW(best.w)}`;
    tip.style.left = (best.X * r.width / W) + 'px'; tip.style.top = (best.Y * r.height / H) + 'px';
  };
  const leave = () => { cross.style.display = 'none'; if (tip) { tip.remove(); tip = null; } };
  hit.addEventListener('mousemove', move); hit.addEventListener('touchstart', move, {passive:true}); hit.addEventListener('touchmove', move, {passive:true});
  hit.addEventListener('mouseleave', leave); hit.addEventListener('touchend', leave);
}

    serving: perServ ? (p.serving_size && p.serving_size.trim() ? p.serving_size.trim() : `${sg} g`) : '100 g', servingGrams: perServ ? sg : 100, per100, ...vals, emoji: '🛒', source: 'off', confidence,

class SrcError extends Error { constructor(src, status, msg){ super(msg || `${src} ${status}`); this.src = src; this.status = status; } }
async function fetchJson(src, url, signal, retries = 1){

      if (r.status === 429) throw new SrcError(src, 429);
      if (r.status >= 500 && i < retries) { await new Promise(res => setTimeout(res, 1500)); continue; }
      if (!r.ok) throw new SrcError(src, r.status);
      return await r.json();
    } catch (e) {

      if (i < retries) { await new Promise(res => setTimeout(res, 1200)); continue; } // network error or reset: one retry
      throw new SrcError(src, 0, e.message);
    }
  }
}
async function searchOFF(q, signal){

          <div class="grid2"><div class="field"><label>Serving</label><input data-e="serving" value="${esc(item.serving)}" placeholder="1 bar (60 g)"></div><div class="field"><label>Emoji</label><input data-e="emoji" value="${esc(item.emoji)}" maxlength="4"></div></div>
          <div class="grid2"><div class="field"><label>Calories per serving</label><input data-n="cal" type="number" inputmode="decimal" value="${item.cal||''}"></div><div class="field"><label>Protein g</label><input data-n="p" type="number" inputmode="decimal" value="${item.p||''}"></div><div class="field"><label>Carbs g</label><input data-n="c" type="number" inputmode="decimal" value="${item.c||''}"></div><div class="field"><label>Fat g</label><input data-n="f" type="number" inputmode="decimal" value="${item.f||''}"></div></div>`
        : `<div class="head">${tileHtml({...item, photo: item.photoLarge || item.photo})}<div style="min-width:0"><h3>${esc(item.name)}</h3><p>${esc(item.brand ? item.brand + ' · ' : '')}${esc(item.quantity || '')}${item.code ? ` <span class="num" style="color:var(--faint)">#${esc(item.code)}</span>` : ''}</p><p>${item.confidence ? `<span class="conf ${esc(item.confidence)}" style="margin-left:0">${confLabel(item.confidence)}</span>` : ''} ${esc(item.note || '')}</p></div></div>`}
        ${canGrams && !st.manual ? `<div class="basis"><button data-basis="serving" class="${st.basis==='serving'?'on':''}">Per serving · ${esc(item.serving)}</button><button data-basis="grams" class="${st.basis==='grams'?'on':''}">By weight</button>${st.basis==='grams' ? `<input id="grams" type="number" inputmode="decimal" value="${r1(st.grams)}" aria-label="grams"> g` : ''}</div>` : ''}
        <div class="grid2">
          ${st.basis === 'grams' ? `<div class="field"><label>Amount</label><div class="stepper"><button data-g="-10" aria-label="Less">−</button><input id="gramsIn" type="number" inputmode="decimal" value="${r1(st.grams)}"><button data-g="10" aria-label="More">+</button></div></div>`
          : `<div class="field"><label>Servings</label><div class="stepper"><button data-step="-0.25" aria-label="Less">−</button><input id="qty" type="number" step="0.25" min="0.25" inputmode="decimal" value="${st.qty}"><button data-step="0.25" aria-label="More">+</button></div></div>`}
          <div class="field"><label>Meal</label><select id="mealSel">${MEALS.map(([k,l]) => `<option value="${k}" ${st.meal===k?'selected':''}>${l}</option>`).join('')}</select></div>
        </div>
        <div class="macroline"><div><b class="num">${tot('cal')}</b><span>kcal</span></div><div><b class="num" style="color:var(--protein)">${tot('p')}</b><span>protein</span></div><div><b class="num" style="color:var(--carbs)">${tot('c')}</b><span>carbs</span></div><div><b class="num" style="color:var(--fat)">${tot('f')}</b><span>fat</span></div></div>
        ${o.fromLibrary ? '' : `<label class="check"><input type="checkbox" id="saveChk" ${st.save?'checked':''}> Approve and save to My Foods for one-tap logging</label>`}
        ${item.confidence === 'estimate' ? `<div class="note">This is an estimate, not a label. Compare with the package once before saving.</div>` : ''}
        <div style="display:flex;gap:8px">
          ${o.back ? `<button class="btn ghost" id="back">Back</button>` : ''}
          <button class="btn primary" id="log" style="flex:1">Add to ${MEAL_NAME[st.meal]}${state.date !== todayStr() ? ' · ' + fmtDate(state.date,{month:'short',day:'numeric'}) : ''}</button>
        </div>
        ${o.fromLibrary ? `<button class="link" id="delFood" style="color:var(--warn);align-self:flex-start">Remove from My Foods</button>` : ''}
      </div>`);
    const refresh = () => { const V2 = vals(); const m = st.basis === 'grams' ? 1 : st.qty; const b = body.querySelectorAll('.macroline b'); b[0].textContent = r0(V2.cal*m); b[1].textContent = r0(V2.p*m); b[2].textContent = r0(V2.c*m); b[3].textContent = r0(V2.f*m); };
    const qtyI = $('#qty', body); if (qtyI) { qtyI.oninput = () => { st.qty = Math.max(0.25, parseFloat(qtyI.value) || 1); refresh(); }; body.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { qtyI.value = Math.max(0.25, (parseFloat(qtyI.value)||1) + parseFloat(b.dataset.step)); qtyI.oninput(); }); }
    const gI = $('#gramsIn', body); if (gI) { const sync = v => { st.grams = Math.max(1, v || 1); gI.value = r1(st.grams); const g2 = $('#grams', body); if (g2) g2.value = r1(st.grams); refresh(); }; gI.oninput = () => sync(parseFloat(gI.value)); $('#grams', body)?.addEventListener('input', e => sync(parseFloat(e.target.value))); body.querySelectorAll('[data-g]').forEach(b => b.onclick = () => sync(st.grams + parseFloat(b.dataset.g))); }
    body.querySelectorAll('[data-basis]').forEach(b => b.onclick = () => { st.basis = b.dataset.basis; draw(); });
    $('#mealSel', body).onchange = e => { st.meal = e.target.value; $('#log', body).textContent = `Add to ${MEAL_NAME[st.meal]}`; };
    $('#saveChk', body)?.addEventListener('change', e => st.save = e.target.checked);
    body.querySelectorAll('[data-e]').forEach(i => i.oninput = () => { item[i.dataset.e] = i.value; });
    body.querySelectorAll('[data-n]').forEach(i => i.oninput = () => { item[i.dataset.n] = Math.max(0, parseFloat(i.value) || 0); refresh(); });
    $('#back', body)?.addEventListener('click', o.back);
    $('#delFood', body)?.addEventListener('click', () => { if (!confirm(`Remove “${item.name}” from My Foods? Past logs keep their numbers.`)) return; delete state.foods[item.foodId]; persistFood(); closeSheet(); toast('Removed.'); render(); });
    $('#log', body).onclick = () => {
      if (st.manual) { item.name = (item.name||'').trim(); item.emoji = firstEmoji(item.emoji); if (!item.name) return toast('Give it a name.'); if (!(item.cal >= 0)) return toast('Enter calories.'); }
      const V2 = vals(); const qty = st.basis === 'grams' ? 1 : st.qty;
      let foodId = item.foodId || null;
      if (st.save && !foodId) { foodId = uid('f_'); state.foods[foodId] = { id: foodId, name: item.name, brand: item.brand||'', code: item.code||null, quantity: item.quantity||'', serving: item.serving, servingGrams: item.servingGrams||null, per100: item.per100||null, cal: item.cal, p: item.p, c: item.c, f: item.f, fiber: item.fiber||0, sugar: item.sugar||0, emoji: item.emoji||'🍽️', photo: item.photo||null, photoLarge: item.photoLarge||null, source: item.source||'off', confidence: item.confidence||null, note: item.note||'', uses: 0, createdAt: Date.now(), lastUsed: Date.now() }; }
      if (foodId && state.foods[foodId]) { state.foods[foodId] = { ...state.foods[foodId], uses: (state.foods[foodId].uses||0) + 1, lastUsed: Date.now() }; persistFood(); }
      addEntry(st.date, { id: uid('e_'), foodId, name: item.name, brand: item.brand||'', emoji: item.emoji||'🍽️', photo: item.photo||null, serving: V2.serving, qty, cal: r1(V2.cal), p: r1(V2.p), c: r1(V2.c), f: r1(V2.f), meal: st.meal, ts: Date.now() });
      closeSheet(); toast(`Added ${item.name} · ${r0(V2.cal*qty)} kcal${st.save && !item.foodId ? ' · saved to My Foods' : ''}`); go('today');
    };
  };
  draw();
}

function openEditEntry(id){
  const d = day(state.date); const e = d.entries.find(x => x.id === id); if (!e) return;
  sheet.open = true; sheet.kind = 'edit';
  let qty = e.qty, meal = e.meal;
  const body = mountSheet('Edit entry', `<div class="detail">
    <div class="head">${tileHtml(e)}<div><h3>${esc(e.name)}</h3><p>${esc(e.brand ? e.brand + ' · ' : '')}${esc(e.serving)} · ${fmtN(e.cal)} kcal each</p></div></div>
    <div class="grid2">
      <div class="field"><label>Servings</label><div class="stepper"><button data-step="-0.25" aria-label="Less">−</button><input id="qty" type="number" step="0.25" min="0.25" inputmode="decimal" value="${qty}"><button data-step="0.25" aria-label="More">+</button></div></div>
      <div class="field"><label>Meal</label><select id="mealSel">${MEALS.map(([k,l]) => `<option value="${k}" ${meal===k?'selected':''}>${l}</option>`).join('')}</select></div>
    </div>
    <div class="macroline"><div><b class="num">${r0(e.cal*qty)}</b><span>kcal</span></div><div><b class="num" style="color:var(--protein)">${r0(e.p*qty)}</b><span>protein</span></div><div><b class="num" style="color:var(--carbs)">${r0(e.c*qty)}</b><span>carbs</span></div><div><b class="num" style="color:var(--fat)">${r0(e.f*qty)}</b><span>fat</span></div></div>
    <div style="display:flex;gap:8px"><button class="btn danger" id="del">Remove</button><button class="btn primary" id="save" style="flex:1">Save</button></div>
    ${!e.foodId ? `<button class="link" id="saveLib">Save this to My Foods too</button>` : ''}
  </div>`);
  const qtyI = $('#qty', body);
  const refresh = () => { qty = Math.max(0.25, parseFloat(qtyI.value) || 1); const b = body.querySelectorAll('.macroline b'); b[0].textContent = r0(e.cal*qty); b[1].textContent = r0(e.p*qty); b[2].textContent = r0(e.c*qty); b[3].textContent = r0(e.f*qty); };
  qtyI.oninput = refresh;
  body.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { qtyI.value = Math.max(0.25, (parseFloat(qtyI.value)||1) + parseFloat(b.dataset.step)); refresh(); });
  $('#mealSel', body).onchange = ev => meal = ev.target.value;
  $('#del', body).onclick = () => { removeEntry(state.date, id); closeSheet(); toast('Removed.'); render(); };
  $('#save', body).onclick = () => { updateEntry(state.date, id, { qty, meal }); closeSheet(); render(); };
  $('#saveLib', body)?.addEventListener('click', () => { const fid = uid('f_'); state.foods[fid] = { id: fid, name: e.name, brand: e.brand, serving: e.serving, cal: e.cal, p: e.p, c: e.c, f: e.f, emoji: e.emoji, photo: e.photo||null, source: 'log', uses: 1, createdAt: Date.now(), lastUsed: Date.now() }; updateEntry(state.date, id, { foodId: fid }); closeSheet(); toast('Saved to My Foods.'); render(); });
}

function openExercise(date){
  sheet.open = true; sheet.kind = 'exercise';
  const kg = (latestWeight() || 180) * LB; let sel = 0, minutes = 30, kcal = null;
  const calc = () => Math.round(EXERCISES[sel][1] * kg * minutes / 60);
  const draw = () => {
    const body = mountSheet('Add exercise', `<div class="detail">
      <div class="exlist">${EXERCISES.map((e, i) => `<button data-ex="${i}" class="${i === sel ? 'on' : ''}"><i>${e[2]}</i>${e[0]}</button>`).join('')}</div>
      <div class="grid2">
        <div class="field"><label>Minutes</label><div class="stepper"><button data-m="-5" aria-label="Less">−</button><input id="mins" type="number" inputmode="numeric" value="${minutes}"><button data-m="5" aria-label="More">+</button></div></div>
        <div class="field"><label>Calories burned</label><input id="kcal" type="number" inputmode="numeric" value="${kcal ?? calc()}"></div>
      </div>
      <p class="hint" style="margin:0">Estimated from your weight (${fmtW(latestWeight())}) and the activity’s intensity. If your watch gives you a number, type that instead.</p>
      <button class="btn primary block" id="ok">Add ${EXERCISES[sel][0]}</button></div>`);
    body.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => { sel = +b.dataset.ex; kcal = null; draw(); });
    const mi = $('#mins', body), ki = $('#kcal', body);
    mi.oninput = () => { minutes = Math.max(1, parseInt(mi.value) || 1); if (kcal == null) ki.value = calc(); };
    body.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { minutes = Math.max(5, minutes + parseInt(b.dataset.m)); mi.value = minutes; if (kcal == null) ki.value = calc(); });
    ki.oninput = () => { kcal = parseInt(ki.value) || null; };
    $('#ok', body).onclick = () => { const k = parseInt(ki.value) || 0; if (k <= 0) return toast('Enter the calories burned.'); addExercise(date, { id: uid('x_'), name: EXERCISES[sel][0] === 'Other' ? 'Exercise' : EXERCISES[sel][0], emoji: EXERCISES[sel][2], minutes, kcal: k, ts: Date.now() }); closeSheet(); toast(`Added ${EXERCISES[sel][0]} · +${k} kcal`); render(); };
  };
  draw();
}

function openWeigh(date){
  sheet.open = true; sheet.kind = 'weigh';
  const cur = day(date).weight;
  const body = mountSheet('Weigh-in', `<div class="detail">
    <p class="hint" style="margin:0">${fmtDate(date, {weekday:'long', month:'long', day:'numeric'})}</p>
    <div class="field"><label>Weight (${units()})</label><input id="w" type="number" step="0.1" inputmode="decimal" value="${cur != null ? fromLb(cur) : (latestWeight() ? fromLb(latestWeight()) : '')}"></div>
    <button class="btn primary block" id="ok">Save</button></div>`);
  $('#w', body).focus(); $('#w', body).select();
  const saveW = () => { const val = parseFloat($('#w', body).value); if (!(val > 0)) return toast('Enter a weight.'); setWeight(date, r1(toLb(val))); closeSheet(); toast(`Logged ${fmtW(toLb(val))}`); render(); };
  $('#ok', body).onclick = saveW; $('#w', body).onkeydown = e => { if (e.key === 'Enter') saveW(); };
}

/* ---------- shell ---------- */
function go(tab){ state.tab = tab; try { localStorage.setItem('hoxfit:tab', tab); } catch {} render(); window.scrollTo({ top: 0 }); }
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet.open) closeSheet(); });
let toastT; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
let rs; window.addEventListener('resize', () => { clearTimeout(rs); rs = setTimeout(() => { if (state.tab === 'weight') renderWeight(); }, 150); });

load(); applyTheme();
try { const t = localStorage.getItem('hoxfit:tab'); if (t && ['today','foods','weight','goals'].includes(t)) state.tab = t; } catch {}
if (!state.profile) state.tab = 'goals';
render();
})();
</script>
</body>
</html>
